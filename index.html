<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal Finder | MD. Ozaire Wasit (2222425) - MIS455</title>
  
  <!-- Bootstrap 5 CSS Framework -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- External Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ==================== HEADER ==================== -->
  <header>
    <div class="container">
      <div class="developer-badge mb-2">
        <span>👨‍💻 Developed by: <strong>MD. Ozaire Wasit</strong> (ID: <strong>2222425</strong>)</span>
      </div>
      <h1 class="display-5 fw-bold">🍽️ Meal Finder</h1>
      <p class="lead">Search and discover delicious recipes from around the world using TheMealDB API</p>
      
      <!-- Search Box -->
      <div class="search-box">
        <div class="input-group input-group-lg">
          <input 
            type="text" 
            id="search-input" 
            class="form-control" 
            placeholder="Type meal name (e.g. Chicken, Pasta, Beef)..." 
            autocomplete="off"
          >
          <button class="btn btn-dark px-4" type="button" id="search-btn" onclick="searchMeals()">Search</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ==================== MAIN CONTENT ==================== -->
  <main class="container my-5" id="main-content">
    
    <!-- Status & Results Message -->
    <div id="status-message" class="text-center mb-4">
      <p class="text-muted fs-5">Enter a meal name above and click Search to see delicious recipes.</p>
    </div>

    <!-- Meal Cards Container (Grid) -->
    <div id="meals-container" class="row g-4">
      <!-- Dynamic Meal Cards will appear here via JavaScript -->
    </div>

    <!-- "SHOW ALL" Button Container -->
    <div id="show-all-container" class="text-center mt-5" style="display: none;">
      <button id="show-all-btn" onclick="showAllMeals()">SHOW ALL</button>
    </div>

  </main>
  <script src="app.js"></script>
</body>
</html>
